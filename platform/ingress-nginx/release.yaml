apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ingress-nginx
  namespace: ingress-nginx
spec:
  interval: 30m
  chart:
    spec:
      chart: ingress-nginx
      version: "4.15.1"
      sourceRef:
        kind: HelmRepository
        name: ingress-nginx
        namespace: flux-system
  values:
    controller:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      kind: Deployment
      replicaCount: 1
      ingressClassResource:
        default: true
      resources:
        requests:
          cpu: 50m
          memory: 90Mi
        limits:
          cpu: 250m
          memory: 256Mi
