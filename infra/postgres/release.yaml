apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: osnova-postgres
  namespace: default
spec:
  interval: 10m
  chart:
    spec:
      chart: postgresql
      sourceRef:
        kind: HelmRepository
        name: bitnami
        namespace: flux-system
  values:
    fullnameOverride: "osnova-db"
    auth:
      database: "postgres"
    primary:
      persistence:
        enabled: true
        storageClass: "local-path"
        size: 8Gi
