apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: osnova-db-backup
  namespace: database
spec:
  schedule: "0 0 3 * * *"
  backupOwnerReference: self
  cluster:
    name: osnova-db
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
    parameters:
      barmanObjectName: osnova-db-backups
  immediate: true
