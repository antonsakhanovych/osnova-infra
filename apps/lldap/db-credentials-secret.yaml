# Same underlying OpenBao secret (lldap-db) materialized two ways:
# a basic-auth Secret in database (for the DatabaseRole's passwordSecret),
# and a templated full connection string in lldap (LLDAP's DATABASE_URL
# doesn't support a separate _FILE override for just the password, so the
# whole URL is rendered here instead).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: lldap-db-credentials
  namespace: database
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: lldap-db-credentials
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
  data:
    - secretKey: username
      remoteRef:
        key: lldap-db
        property: username
    - secretKey: password
      remoteRef:
        key: lldap-db
        property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: lldap-database-url
  namespace: lldap
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: lldap-database-url
    creationPolicy: Owner
    template:
      data:
        database_url: "postgres://{{ .username }}:{{ .password }}@osnova-db-rw.database.svc.cluster.local:5432/lldap"
  data:
    - secretKey: username
      remoteRef:
        key: lldap-db
        property: username
    - secretKey: password
      remoteRef:
        key: lldap-db
        property: password
