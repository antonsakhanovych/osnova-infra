apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: lldap-admin-credentials
  namespace: lldap
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: lldap-admin-credentials
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: lldap-admin
        property: password
    - secretKey: jwt_secret
      remoteRef:
        key: lldap-admin
        property: jwt_secret
    - secretKey: key_seed
      remoteRef:
        key: lldap-admin
        property: key_seed
---
# Same admin password, materialized into authelia's namespace too - it's
# used there as the LDAP bind credential (Authelia binds as this account
# to query LLDAP). A dedicated, less-privileged bind account is a nice
# future improvement, but LLDAP has no declarative bootstrap for creating
# one, so this starts with the admin account for simplicity.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: lldap-bind-credentials
  namespace: authelia
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: lldap-bind-credentials
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: lldap-admin
        property: password
