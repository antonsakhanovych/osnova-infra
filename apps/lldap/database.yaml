apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: lldap
  namespace: database
spec:
  cluster:
    name: osnova-db
  name: lldap
  owner: lldap
---
apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: lldap
  namespace: database
spec:
  cluster:
    name: osnova-db
  name: lldap
  login: true
  passwordSecret:
    name: lldap-db-credentials
