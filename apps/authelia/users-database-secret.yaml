# Renders Authelia's file-backend users_database.yml from individual
# fields in OpenBao, so seeding a new admin user is just plain key=value
# pairs via seed-secret.sh rather than hand-crafting YAML in the vault.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authelia-users-database
  namespace: authelia
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: authelia-users-database
    creationPolicy: Owner
    template:
      data:
        users_database.yml: |
          users:
            {{ .username }}:
              displayname: "{{ .display_name }}"
              password: "{{ .password_hash }}"
              email: {{ .email }}
              groups:
                - admins
  data:
    - secretKey: username
      remoteRef:
        key: authelia-admin-user
        property: username
    - secretKey: display_name
      remoteRef:
        key: authelia-admin-user
        property: display_name
    - secretKey: email
      remoteRef:
        key: authelia-admin-user
        property: email
    - secretKey: password_hash
      remoteRef:
        key: authelia-admin-user
        property: password_hash
