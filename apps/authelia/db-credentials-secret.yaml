# Same underlying OpenBao secret (authelia-db), materialized in both the
# database namespace (for the DatabaseRole's passwordSecret) and the
# authelia namespace (for the app itself to connect with).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authelia-db-credentials
  namespace: database
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: authelia-db-credentials
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
  data:
    - secretKey: username
      remoteRef:
        key: authelia-db
        property: username
    - secretKey: password
      remoteRef:
        key: authelia-db
        property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authelia-db-credentials
  namespace: authelia
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: authelia-db-credentials
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: authelia-db
        property: username
    - secretKey: password
      remoteRef:
        key: authelia-db
        property: password
