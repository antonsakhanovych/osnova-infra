apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: authelia
  namespace: database
spec:
  cluster:
    name: osnova-db
  name: authelia
  owner: authelia
---
apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: authelia
  namespace: database
spec:
  cluster:
    name: osnova-db
  name: authelia
  login: true
  passwordSecret:
    name: authelia-db-credentials
